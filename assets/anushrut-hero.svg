<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Anushrut Pandit profile hero</title>
  <desc id="desc">A dark editorial technical banner with geometric signal paths and the name Anushrut Pandit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070707"/>
      <stop offset="0.43" stop-color="#10100E"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="hot" x1="140" y1="86" x2="1150" y2="444" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3FF6B"/>
      <stop offset="0.38" stop-color="#31F7C8"/>
      <stop offset="0.7" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#FF5C8A"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.15 0 1 0 0 0.95 0 0 1 0 0.82 0 0 0 0.52 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="frame">
      <rect x="34" y="34" width="1212" height="452" rx="30"/>
    </clipPath>
  </defs>

  <rect width="1280" height="520" rx="36" fill="url(#bg)"/>
  <rect x="34" y="34" width="1212" height="452" rx="30" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <g clip-path="url(#frame)">
    <rect x="34" y="34" width="1212" height="452" fill="url(#grid)"/>
    <path d="M-80 448 C148 358 205 140 412 182 C606 221 597 397 789 360 C973 325 957 112 1360 76" stroke="url(#hot)" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlow)" opacity="0.92"/>
    <path d="M-40 404 C164 322 256 205 420 226 C598 249 604 414 792 375 C987 335 1012 168 1312 128" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2"/>
    <path d="M814 55 L1232 55 L1232 196 L1008 196 Z" fill="#F3FF6B" fill-opacity="0.9"/>
    <path d="M920 292 L1260 236 L1260 480 L830 480 Z" fill="#31F7C8" fill-opacity="0.1"/>
    <path d="M52 354 L410 280 L476 486 L52 486 Z" fill="#FF5C8A" fill-opacity="0.11"/>
    <g opacity="0.88">
      <rect x="84" y="78" width="110" height="8" fill="#F3FF6B"/>
      <rect x="206" y="78" width="48" height="8" fill="#31F7C8"/>
      <rect x="266" y="78" width="180" height="8" fill="#FFFFFF" fill-opacity="0.22"/>
    </g>
    <text x="84" y="148" fill="#F6F3EA" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="5">FULL STACK / PRODUCT SYSTEMS</text>
    <text x="80" y="262" fill="#F6F3EA" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="82" font-weight="900" letter-spacing="-4">ANUSHRUT</text>
    <text x="82" y="348" fill="#F6F3EA" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="82" font-weight="900" letter-spacing="-4">PANDIT</text>
    <text x="88" y="410" fill="#BDB8AA" font-family="Courier New, monospace" font-size="18">TypeScript / Python / Interfaces / Backends / Shipping</text>
    <g transform="translate(836 82)">
      <text x="0" y="0" fill="#080808" font-family="Courier New, monospace" font-size="15" font-weight="700">CURRENT SIGNAL</text>
      <text x="0" y="34" fill="#080808" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" letter-spacing="-1.5">CONTEXTVAULT</text>
      <text x="0" y="68" fill="#080808" font-family="Courier New, monospace" font-size="14">NAVI MUMBAI / UTC+05:30</text>
    </g>
    <g transform="translate(1010 286)">
      <rect x="0" y="0" width="168" height="128" rx="18" fill="#090909" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="20" y="38" fill="#31F7C8" font-family="Courier New, monospace" font-size="13">BUILD MODE</text>
      <text x="20" y="72" fill="#F6F3EA" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800">ship real</text>
      <rect x="20" y="94" width="126" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.14"/>
      <rect x="20" y="94" width="92" height="6" rx="3" fill="url(#hot)"/>
    </g>
    <g opacity="0.42">
      <path d="M734 115 H773 V154 H812 V193 H851" stroke="#FFFFFF" stroke-width="1"/>
      <path d="M704 405 H746 V363 H791 V321 H833" stroke="#FFFFFF" stroke-width="1"/>
      <circle cx="734" cy="115" r="4" fill="#F3FF6B"/>
      <circle cx="851" cy="193" r="4" fill="#31F7C8"/>
      <circle cx="704" cy="405" r="4" fill="#FF5C8A"/>
      <circle cx="833" cy="321" r="4" fill="#A78BFA"/>
    </g>
  </g>
  <rect width="1280" height="520" rx="36" filter="url(#grain)" opacity="0.22"/>
  <rect x="34" y="34" width="1212" height="452" rx="30" stroke="#FFFFFF" stroke-opacity="0.16"/>
</svg>
