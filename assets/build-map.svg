<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Build map</title>
  <desc id="desc">Three connected panels describing interface, runtime, and shipping layers.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F2E8"/>
      <stop offset="0.5" stop-color="#F5F0E6"/>
      <stop offset="1" stop-color="#ECE8DC"/>
    </linearGradient>
    <linearGradient id="ink" x1="120" y1="60" x2="1160" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="0.52" stop-color="#23302D"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="accent" x1="188" y1="65" x2="1110" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5C8A"/>
      <stop offset="0.48" stop-color="#31F7C8"/>
      <stop offset="1" stop-color="#F3FF6B"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#111111" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#paper)"/>
  <rect x="28" y="28" width="1224" height="304" rx="24" fill="url(#dots)" opacity="0.9"/>
  <path d="M111 256 C279 102 413 305 561 156 C716 1 816 286 983 141 C1068 67 1134 91 1191 121" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>

  <g transform="translate(78 72)">
    <rect width="328" height="208" rx="18" fill="#FBFAF4" stroke="#111111" stroke-opacity="0.14"/>
    <text x="28" y="48" fill="#111111" font-family="Courier New, monospace" font-size="14" font-weight="700">01 / INTERFACE</text>
    <text x="28" y="99" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" letter-spacing="-1.4">calm frontends</text>
    <text x="28" y="140" fill="#5F5B52" font-family="Arial, Helvetica, sans-serif" font-size="17">Readable flows, direct states,</text>
    <text x="28" y="164" fill="#5F5B52" font-family="Arial, Helvetica, sans-serif" font-size="17">interfaces that explain themselves.</text>
    <rect x="28" y="184" width="104" height="6" rx="3" fill="#FF5C8A"/>
  </g>

  <g transform="translate(476 72)">
    <rect width="328" height="208" rx="18" fill="#111111"/>
    <text x="28" y="48" fill="#31F7C8" font-family="Courier New, monospace" font-size="14" font-weight="700">02 / RUNTIME</text>
    <text x="28" y="99" fill="#F8F4EA" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" letter-spacing="-1.4">boring systems</text>
    <text x="28" y="140" fill="#C9C2B4" font-family="Arial, Helvetica, sans-serif" font-size="17">APIs, queues, data, logs,</text>
    <text x="28" y="164" fill="#C9C2B4" font-family="Arial, Helvetica, sans-serif" font-size="17">and the work that holds.</text>
    <rect x="28" y="184" width="152" height="6" rx="3" fill="#31F7C8"/>
  </g>

  <g transform="translate(874 72)">
    <rect width="328" height="208" rx="18" fill="#FBFAF4" stroke="#111111" stroke-opacity="0.14"/>
    <text x="28" y="48" fill="#111111" font-family="Courier New, monospace" font-size="14" font-weight="700">03 / SHIP</text>
    <text x="28" y="99" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" letter-spacing="-1.4">real releases</text>
    <text x="28" y="140" fill="#5F5B52" font-family="Arial, Helvetica, sans-serif" font-size="17">Scope cut cleanly, reviewed,</text>
    <text x="28" y="164" fill="#5F5B52" font-family="Arial, Helvetica, sans-serif" font-size="17">then pushed where people can use it.</text>
    <rect x="28" y="184" width="190" height="6" rx="3" fill="#F3FF6B"/>
  </g>

  <text x="78" y="318" fill="#111111" fill-opacity="0.55" font-family="Courier New, monospace" font-size="13">ANUSHLINUX / PRODUCT ENGINEERING / TYPESCRIPT + PYTHON</text>
</svg>
