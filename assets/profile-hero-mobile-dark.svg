<svg width="640" height="620" viewBox="0 0 640 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Anushrut Pandit — building Smalltalk</title>
  <desc id="desc">A compact dark green and soft white profile banner with Anushrut Pandit's name and a Smalltalk Continue card.</desc>
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#F3F5F2" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="638" height="618" rx="28" fill="#101816" stroke="#34413E" stroke-width="2"/>
  <path d="M28 28H612V286H28V28Z" fill="url(#grid)"/>
  <path d="M1 286H639V591C639 606.464 626.464 619 611 619H29C13.536 619 1 606.464 1 591V286Z" fill="#122D28"/>
  <path d="M1 286H639" stroke="#34413E"/>

  <g transform="translate(36 35)">
    <rect width="10" height="10" rx="5" fill="#70C7B5"/>
    <text x="20" y="10" fill="#A9BAB5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650">PRODUCT ENGINEER · MUMBAI</text>
    <text x="-2" y="82" fill="#F3F5F2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="760" letter-spacing="-2">Anushrut Pandit</text>
    <path d="M0 111H568" stroke="#34413E"/>
    <text x="0" y="145" fill="#879B95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650">BUILDING NOW</text>
    <text x="0" y="184" fill="#70C7B5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="720" letter-spacing="-0.7">Smalltalk</text>
    <text x="146" y="182" fill="#A9BAB5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16">Return to unfinished work.</text>
  </g>

  <g transform="translate(28 310)" filter="url(#card-shadow)">
    <rect width="584" height="282" rx="20" fill="#16221F" stroke="#40504C"/>
    <circle cx="26" cy="25" r="4.5" fill="#C66B60"/>
    <circle cx="43" cy="25" r="4.5" fill="#C79A50"/>
    <circle cx="60" cy="25" r="4.5" fill="#70C7B5"/>
    <text x="84" y="30" fill="#879B95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="650">SMALLTALK / CONTINUE</text>
    <path d="M0 50H584" stroke="#34413E"/>
    <text x="26" y="81" fill="#879B95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1">YOU WERE</text>
    <text x="26" y="113" fill="#F3F5F2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700">Building Smalltalk</text>
    <text x="26" y="139" fill="#A9BAB5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">Turning interruption into a clear next move.</text>
    <path d="M26 158H558" stroke="#34413E"/>
    <text x="26" y="188" fill="#879B95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1">NEXT</text>
    <text x="26" y="219" fill="#F3F5F2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650">Make task truth durable, local, and evidence-backed.</text>
    <rect x="26" y="242" width="136" height="23" rx="11.5" fill="#1C3C35"/>
    <circle cx="41" cy="253.5" r="3.5" fill="#70C7B5"/>
    <text x="52" y="258" fill="#A7E0D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700">LOCAL-FIRST</text>
    <text x="459" y="258" fill="#879B95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">TECHNICAL ALPHA</text>
  </g>
</svg>
